<style>

    --surface: #FFFFFF;
    --surface-2: #EBF1F8;
    --ink: #1B2430;
    --ink-soft: #55606C;
    --ink-faint: #8996A2;
    --accent: #21519A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3ECF8;
    --accent2: #2E9E4E;
    --accent2-soft: #E3F5E8;
    --border: #E2E7EB;
    --border-strong: #C9D2DA;
    --shadow: 0 1px 2px rgba(27,36,48,.04), 0 6px 18px rgba(27,36,48,.06);

      --ink: #EEF2F6; --ink-soft: #B8C3CD; --ink-faint: #7E8B97;
      --accent: #6FA3E0; --accent-ink: #0C1D33; --accent-soft: #24374F;

      --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 20px rgba(0,0,0,.25);
      --danger: #E8917C; --ok: #6BCB8C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161B21; --surface: #1D242C; --surface-2: #242D36;
    --ink: #EEF2F6; --ink-soft: #B8C3CD; --ink-faint: #7E8B97;
    --accent: #6FA3E0; --accent-ink: #0C1D33; --accent-soft: #24374F;
    --accent2: #6BCB8C; --accent2-soft: #203A29;
    --border: #2B333C; --border-strong: #3A434D;

  body {

  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  input, select { font: inherit; color: inherit; }

  h1,h2,h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; text-wrap: balance; margin: 0; }
  .price { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ---- shell ---- */
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 0.9rem 1.5rem;
    display: flex; align-items: center; gap: 2rem;
  }
  .logo { display: flex; align-items: center; gap: 0.5rem; font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.2rem; flex-shrink: 0; }
  .logo .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: var(--accent-ink); font-weight: 700; font-family: 'Fraunces', serif; }
  nav.mainnav { display: flex; gap: 1.6rem; font-size: 0.95rem; font-weight: 600; color: var(--ink-soft); }
  nav.mainnav a { padding: 0.3rem 0; border-bottom: 2px solid transparent; }
  nav.mainnav a.active, nav.mainnav a:hover { color: var(--ink); border-color: var(--accent); }
  .topbar-spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    border-radius: 8px; padding: 0.55rem 1.1rem; font-weight: 600; font-size: 0.9rem;
    border: 1px solid transparent; cursor: pointer; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { background: transparent; border-color: var(--border-strong); color: var(--ink); }
  .btn-ghost:hover { background: var(--surface-2); }

  main { max-width: 1180px; margin: 0 auto; padding: 0 1.5rem 5rem; }
  footer { border-top: 1px solid var(--border); margin-top: 4rem; }
  .footer-inner { max-width: 1180px; margin: 0 auto; padding: 2.5rem 1.5rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; color: var(--ink-faint); font-size: 0.85rem; }

  /* ---- hero / search ---- */
  .hero { padding: 4.5rem 0 3rem; text-align: center; }
  .hero h1 { font-size: clamp(2.1rem, 5vw, 3.1rem); max-width: 20ch; margin: 0 auto 0.8rem; }
  .hero .sub { color: var(--ink-soft); font-size: 1.1rem; max-width: 46ch; margin: 0 auto 2.2rem; }

  .searchbar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 0.9rem; max-width: 880px; margin: 0 auto;
    display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 0.6rem; align-items: end; text-align: left;
  }
  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); font-weight: 600; }
  .field input, .field select {
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 0.6rem 0.7rem;
    background: var(--surface); color: var(--ink); font-size: 0.92rem;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .searchbar .btn-primary { padding: 0.65rem 1.3rem; height: fit-content; }
  .segtoggle { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; margin: 0 auto 1.6rem; }
  .segtoggle button { padding: 0.5rem 1.2rem; background: var(--surface); border: none; color: var(--ink-soft); font-weight: 600; cursor: pointer; }

  .fav {

  .empty { text-align: center; padding: 4rem 1rem; color: var(--ink-faint); }

  /* ---- detalhe ---- */

  .back-link:hover { color: var(--ink); }
  .detail-hero { aspect-ratio: 21/8; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 1.6rem; }

  .detail-price { font-size: 1.8rem; font-weight: 600; }

  .detail-title { font-size: 1.5rem; margin-bottom: 0.3rem; }
  .detail-addr { color: var(--ink-soft); margin-bottom: 1.4rem; }
  .feature-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 0.8rem; margin-bottom: 1.8rem; }
  .feature-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem; text-align: center; }

  .feature-tile .l { font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; margin-top: 0.15rem; }
  .desc { color: var(--ink-soft); margin-bottom: 1.6rem; }
  .desc p { margin: 0 0 0.9rem; }
  .amenities { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
  .amenity { font-size: 0.82rem; background: var(--surface-2); color: var(--ink-soft); padding: 0.4rem 0.8rem; border-radius: 999px; }

  .contact-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.4rem; box-shadow: var(--shadow); position: sticky; top: 5.5rem; }
  .agent { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1.1rem; }
  .agent .av { width: 44px; height: 44px; border-radius: 50%; background: var(--accent2-soft); color: var(--accent2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'Fraunces', serif; }
  .agent .name { font-weight: 600; font-size: 0.95rem; }
  .agent .role { font-size: 0.78rem; color: var(--ink-faint); }
  .contact-card form { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.6rem; }
  .contact-card input, .contact-card textarea { border: 1px solid var(--border-strong); border-radius: 8px; padding: 0.6rem 0.7rem; background: var(--surface); color: var(--ink); font-size: 0.9rem; }
  .contact-card textarea { resize: vertical; min-height: 70px; }
  .contact-card .btn-primary { width: 100%; justify-content: center; margin-top: 0.2rem; }
  .disclaimer { font-size: 0.74rem; color: var(--ink-faint); margin-top: 0.7rem; }

  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 0.7rem 1.2rem; border-radius: 10px;
    font-size: 0.88rem; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 880px) {
    .grid { grid-template-columns: repeat(2,1fr); }
    .busca-layout, .detail-layout { grid-template-columns: 1fr; }
    .filters, .contact-card { position: static; }
    .searchbar { grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: repeat(2,1fr); }
    nav.mainnav { display: none; }
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .feature-grid { grid-template-columns: repeat(2,1fr); }
    .searchbar { grid-template-columns: 1fr; }
    .topbar-inner .btn-primary[disabled] { display: none; }
    .topbar-inner { gap: 1rem; }
  }
</style>

  return finalidade === "aluguel" ? s : s;

/* ===================== ilustrações SVG (sem fotos reais) ===================== */
function thumbSVG(im, tall) {
  const h = im.hue;
  const c1 = `hsl(${h} 45% ${tall?32:38}%)`, c2 = `hsl(${h} 40% ${tall?22:26}%)`, sky = `hsl(${h+20} 55% 88%)`;
  let building = '';
  if (im.tipo === "Casa") {
    building = `
      <rect x="60" y="140" width="180" height="90" fill="${c1}"/>
      <polygon points="50,140 150,80 250,140" fill="${c2}"/>
      <rect x="140" y="180" width="30" height="50" fill="hsl(${h} 30% 15%)"/>
      <rect x="85" y="160" width="24" height="24" fill="${sky}"/>
      <rect x="191" y="160" width="24" height="24" fill="${sky}"/>`;
  } else if (im.tipo === "Terreno") {
    building = `
      <rect x="40" y="150" width="220" height="80" fill="hsl(${h} 35% 45%)"/>
      <line x1="40" y1="150" x2="260" y2="150" stroke="hsl(${h} 30% 30%)" stroke-width="3" stroke-dasharray="8 6"/>
      <line x1="40" y1="150" x2="40" y2="230" stroke="hsl(${h} 30% 30%)" stroke-width="3" stroke-dasharray="8 6"/>
      <line x1="260" y1="150" x2="260" y2="230" stroke="hsl(${h} 30% 30%)" stroke-width="3" stroke-dasharray="8 6"/>`;
  } else if (im.tipo === "Sala Comercial") {
    building = `
      <rect x="70" y="60" width="160" height="170" fill="${c1}"/>
      ${Array.from({length:5}).map((_,r)=>Array.from({length:4}).map((_,c)=>`<rect x="${88+c*32}" y="${78+r*30}" width="20" height="18" fill="${sky}"/>`).join('')).join('')}`;
  } else {
    // apartamento / studio / cobertura / kitnet: prédio
    const floors = tall ? 7 : 6;
    building = `
      <rect x="90" y="${230-floors*24}" width="140" height="${floors*24}" fill="${c1}"/>
      ${Array.from({length:floors}).map((_,r)=>Array.from({length:3}).map((_,c)=>`<rect x="${106+c*40}" y="${230-floors*24+10+r*24}" width="24" height="16" fill="${sky}"/>`).join('')).join('')}
      ${im.tipo==="Cobertura" ? `<rect x="105" y="${230-floors*24-16}" width="110" height="16" fill="${c2}"/>` : ''}`;
  }
  return `<svg viewBox="0 0 300 230" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="230" fill="${sky}"/>
    <rect y="228" width="300" height="2" fill="hsl(${h} 20% 60%)"/>
    ${building}
  </svg>`;
}

/* ===================== helpers ===================== */
function cardHTML(im) {
  const per = im.finalidade === "aluguel" ? '<span class="per">/mês</span>' : '';
  return `<article class="card" data-goto="imovel/${im.id}">
    <div class="thumb">
      ${thumbSVG(im)}
      <span class="badge ${im.finalidade}">${im.finalidade === 'venda' ? 'Venda' : 'Aluguel'}</span>
      <button class="fav" aria-pressed="false" data-fav="${im.id}" title="Favoritar" onclick="event.stopPropagation(); toggleFav(this, ${im.id})">♥</button>
    </div>
    <div class="body">
      <div class="price">${fmtPreco(im.preco, im.finalidade)}${per}</div>
      <div class="title">${im.titulo}</div>
      <div class="addr">${im.bairro}, ${im.cidade}</div>
      <div class="meta">
        ${im.quartos ? `<span>🛏 ${im.quartos}</span>` : ''}
        ${im.banheiros ? `<span>🛁 ${im.banheiros}</span>` : ''}
        ${im.vagas ? `<span>🚗 ${im.vagas}</span>` : ''}
        <span>📐 ${im.area}m²</span>
      </div>
    </div>
  </article>`;
}

function toggleFav(btn, id) {
  const on = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', String(!on));
  showToast(!on ? 'Adicionado aos favoritos' : 'Removido dos favoritos');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===================== views ===================== */
function viewHome() {
  const destaques = IMOVEIS.slice(0, 6);
  return `
    <section class="hero">
      <h1>Encontre o imóvel certo, sem complicação</h1>
      <p class="sub">Busque, compare e fale direto com o corretor — tudo em um só lugar.</p>
      <form class="searchbar" onsubmit="event.preventDefault(); goBuscaFromForm(this);">
        <div class="field">
          <label for="h-local">Cidade ou bairro</label>
          <input id="h-local" name="local" placeholder="Ex: Vila Mariana, São Paulo" />
        </div>
        <div class="field">
          <label for="h-tipo">Tipo</label>
          <select id="h-tipo" name="tipo">
            <option value="">Todos</option>
            <option>Apartamento</option><option>Casa</option><option>Studio</option>
            <option>Cobertura</option><option>Kitnet</option><option>Sala Comercial</option><option>Terreno</option>
          </select>
        </div>
        <div class="field">
          <label for="h-finalidade">Finalidade</label>
          <select id="h-finalidade" name="finalidade">
            <option value="">Comprar ou alugar</option>
            <option value="venda">Comprar</option>
            <option value="aluguel">Alugar</option>
          </select>
        </div>
        <button class="btn btn-primary" type="submit">Buscar</button>
      </form>
    </section>

    <div class="stats-row">
      <div class="stat-tile"><div class="num">${IMOVEIS.length}</div><div class="label">imóveis no portal</div></div>
      <div class="stat-tile"><div class="num">${new Set(IMOVEIS.map(i=>i.bairro)).size}</div><div class="label">bairros atendidos</div></div>
      <div class="stat-tile"><div class="num">${IMOVEIS.filter(i=>i.finalidade==='venda').length}</div><div class="label">para comprar</div></div>
      <div class="stat-tile"><div class="num">${IMOVEIS.filter(i=>i.finalidade==='aluguel').length}</div><div class="label">para alugar</div></div>
    </div>

    <div class="section-head">
      <h2>Imóveis em destaque</h2>
      <a href="#/busca" class="btn btn-ghost">Ver todos</a>
    </div>
    <div class="grid">${destaques.map(cardHTML).join('')}</div>
  `;
}

function goBuscaFromForm(form) {
  const p = new URLSearchParams();
  const local = form.local.value.trim();
  if (local) p.set('local', local);
  if (form.tipo.value) p.set('tipo', form.tipo.value);
  if (form.finalidade.value) p.set('finalidade', form.finalidade.value);
  location.hash = '#/busca' + (p.toString() ? '?' + p.toString() : '');
}

let filtroState = { finalidade: '', tipo: '', quartosMin: 0, precoMax: null };

function viewBusca(params) {
  filtroState.finalidade = params.get('finalidade') || filtroState.finalidade || '';
  filtroState.tipo = params.get('tipo') || filtroState.tipo || '';
  const local = (params.get('local') || '').toLowerCase();

  const tipos = [...new Set(IMOVEIS.map(i=>i.tipo))];
  const maxPreco = Math.max(...IMOVEIS.map(i=>i.preco));
  if (filtroState.precoMax == null) filtroState.precoMax = maxPreco;

  const resultados = IMOVEIS.filter(im => {
    if (filtroState.finalidade && im.finalidade !== filtroState.finalidade) return false;
    if (filtroState.tipo && im.tipo !== filtroState.tipo) return false;
    if (filtroState.quartosMin && im.quartos < filtroState.quartosMin) return false;
    if (im.preco > filtroState.precoMax) return false;
    if (local && !(im.bairro.toLowerCase().includes(local) || im.cidade.toLowerCase().includes(local))) return false;
    return true;
  });

  setTimeout(() => {
    document.querySelectorAll('[data-finalidade]').forEach(b => b.classList.toggle('active', b.dataset.finalidade === filtroState.finalidade));
    document.querySelectorAll('[data-tipo]').forEach(b => b.classList.toggle('active', b.dataset.tipo === filtroState.tipo));
    document.querySelectorAll('[data-quartos]').forEach(b => b.classList.toggle('active', String(filtroState.quartosMin) === b.dataset.quartos));
    const range = document.getElementById('f-preco'); if (range) range.value = filtroState.precoMax;
    const rv = document.getElementById('f-preco-val'); if (rv) rv.textContent = 'até R$ ' + Number(filtroState.precoMax).toLocaleString('pt-BR');
  }, 0);

  return `
    <div class="section-head" style="margin-top:1.6rem">
      <h2>Buscar imóveis</h2>
      <span class="count">${resultados.length} resultado${resultados.length===1?'':'s'}</span>
    </div>
    <div class="busca-layout">
      <aside class="filters">
        <h3>Filtros</h3>
        <div class="filter-group">
          <span class="flabel">Finalidade</span>
          <div class="chip-row">
            <button class="chip" data-finalidade="" onclick="setFiltro('finalidade','')">Todas</button>
            <button class="chip" data-finalidade="venda" onclick="setFiltro('finalidade','venda')">Comprar</button>
            <button class="chip" data-finalidade="aluguel" onclick="setFiltro('finalidade','aluguel')">Alugar</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="flabel">Tipo</span>
          <div class="chip-row">
            <button class="chip" data-tipo="" onclick="setFiltro('tipo','')">Todos</button>
            ${tipos.map(t=>`<button class="chip" data-tipo="${t}" onclick="setFiltro('tipo','${t}')">${t}</button>`).join('')}
          </div>
        </div>
        <div class="filter-group">
          <span class="flabel">Quartos (mín.)</span>
          <div class="chip-row">
            ${[0,1,2,3,4].map(n=>`<button class="chip" data-quartos="${n}" onclick="setFiltroNum('quartosMin',${n})">${n===0?'Todos':n+'+'}</button>`).join('')}
          </div>
        </div>
        <div class="filter-group">
          <span class="flabel">Preço máximo</span>
          <input type="range" id="f-preco" min="1000" max="${maxPreco}" step="1000" oninput="setPreco(this.value)" />
          <div class="range-val" id="f-preco-val"></div>
        </div>
      </aside>
      <div>
        ${resultados.length ? `<div class="grid">${resultados.map(cardHTML).join('')}</div>` : `<div class="empty">Nenhum imóvel encontrado com esses filtros.<br><br><button class="btn btn-ghost" onclick="resetFiltros()">Limpar filtros</button></div>`}
      </div>
    </div>
  `;
}

function setFiltro(k, v) { filtroState[k] = v; render(); }
function setFiltroNum(k, v) { filtroState[k] = v; render(); }
function setPreco(v) { filtroState.precoMax = Number(v); render(); }
function resetFiltros() { filtroState = { finalidade:'', tipo:'', quartosMin:0, precoMax:null }; location.hash = '#/busca'; }

function viewImovel(id) {
  const im = IMOVEIS.find(i => i.id === Number(id));
  if (!im) return `<div class="empty">Imóvel não encontrado. <a href="#/busca">Voltar à busca</a></div>`;
  const per = im.finalidade === 'aluguel' ? '<span class="per">/mês</span>' : '';
  const iniciais = im.bairro.slice(0,2).toUpperCase();
  return `
    <a class="back-link" onclick="history.back()">← Voltar</a>
    <div class="detail-hero">${thumbSVG(im, true)}</div>
    <div class="detail-layout">
      <div>
        <div class="detail-top">
          <div>
            <h1 class="detail-title">${im.titulo}</h1>
            <div class="detail-addr">${im.bairro}, ${im.cidade}</div>
          </div>
          <span class="badge ${im.finalidade}" style="position:static">${im.finalidade==='venda'?'Venda':'Aluguel'}</span>
        </div>
        <div class="detail-price">${fmtPreco(im.preco, im.finalidade)}${per}</div>

        <div class="feature-grid" style="margin-top:1.6rem">
          <div class="feature-tile"><div class="n">${im.quartos}</div><div class="l">Quartos</div></div>
          <div class="feature-tile"><div class="n">${im.banheiros}</div><div class="l">Banheiros</div></div>
          <div class="feature-tile"><div class="n">${im.vagas}</div><div class="l">Vagas</div></div>
          <div class="feature-tile"><div class="n">${im.area}m²</div><div class="l">Área</div></div>
        </div>

        <div class="desc"><p>${im.desc}</p></div>

        <div class="amenities">${im.amenities.map(a=>`<span class="amenity">${a}</span>`).join('')}</div>
      </div>

      <div class="contact-card">
        <div class="agent">
          <div class="av">${iniciais}</div>
          <div>
            <div class="name">Corretor Malb Imóveis</div>
            <div class="role">CRECI 000000-F (exemplo)</div>
          </div>
        </div>
        <form onsubmit="event.preventDefault(); showToast('Mensagem enviada (simulação) — em breve o corretor entra em contato.'); this.reset();">
          <input placeholder="Seu nome" required />
          <input placeholder="Telefone ou e-mail" required />
          <textarea placeholder="Tenho interesse neste imóvel...">Olá! Tenho interesse no imóvel "${im.titulo}" em ${im.bairro}.</textarea>
          <button class="btn btn-primary" type="submit">Enviar interesse</button>
        </form>
        <div class="disclaimer">Formulário de demonstração — nenhuma mensagem é enviada de verdade nesta fase do protótipo.</div>
      </div>
    </div>
  `;
}

/* ===================== router ===================== */
function render() {
  const hash = location.hash.replace(/^#\/?/, '');
  const [path, qs] = hash.split('?');
  const params = new URLSearchParams(qs || '');
  const app = document.getElementById('app');

  document.querySelectorAll('#mainnav a').forEach(a => a.classList.remove('active'));

  if (!path || path === '/') {
    app.innerHTML = viewHome();
    document.querySelector('[data-nav="home"]')?.classList.add('active');
  } else if (path === 'busca') {
    app.innerHTML = viewBusca(params);
    const f = params.get('finalidade');
    if (f === 'venda') document.querySelector('[data-nav="venda"]')?.classList.add('active');
    else if (f === 'aluguel') document.querySelector('[data-nav="aluguel"]')?.classList.add('active');
  } else if (path.startsWith('imovel/')) {
    app.innerHTML = viewImovel(path.split('/')[1]);
  } else {
    app.innerHTML = `<div class="empty">Página não encontrada. <a href="#/">Voltar ao início</a></div>`;
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
}

document.addEventListener('click', (e) => {
  const card = e.target.closest('[data-goto]');
  if (card) location.hash = '#/' + card.dataset.goto;
});

window.addEventListener('hashchange', render);
render();

/* ---- theme toggle (persist only in-memory, no storage per artifact rules) ---- */
let manualTheme = null;
document.getElementById('theme-toggle').addEventListener('click', () => {
  const root = document.documentElement;
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const current = root.getAttribute('data-theme') || (prefersDark ? 'dark' : 'light');
  manualTheme = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', manualTheme);
});
</script>
