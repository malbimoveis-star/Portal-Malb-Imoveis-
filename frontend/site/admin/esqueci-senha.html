<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esqueci minha senha — Portal Malb Imóveis</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div id="topbar"></div>

<main>
  <div class="login-shell">
    <h1>Esqueci minha senha</h1>
    <p class="sub">Informe o e-mail cadastrado no painel e enviaremos um link para você criar uma nova senha.</p>
    <div class="error-msg" id="erro"></div>
    <div class="error-msg" id="sucesso" style="background:color-mix(in srgb, var(--accent2) 14%, transparent);color:var(--accent2);"></div>
    <form class="form-stack" id="form-esqueci">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <button type="submit" class="btn btn-primary" id="btn-enviar" style="width:100%;justify-content:center;">Enviar link</button>
    </form>
    <p class="hint"><a href="login.html">Voltar para o login</a></p>
  </div>
</main>

<script src="../assets/app.js"></script>
<script>
document.getElementById('topbar').innerHTML = topbarHTML('', '../');

document.getElementById('form-esqueci').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erroEl = document.getElementById('erro');
  const sucessoEl = document.getElementById('sucesso');
  erroEl.classList.remove('show');
  sucessoEl.classList.remove('show');
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const resp = await api('/auth/esqueci-senha', { method: 'POST', body: {
      email: document.getElementById('email').value,
    }});
    sucessoEl.textContent = resp.data.mensagem;
    sucessoEl.classList.add('show');
    document.getElementById('form-esqueci').reset();
  } catch (err) {
    erroEl.textContent = 'Erro: ' + err.message;
    erroEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar link';
  }
});
</script>
</body>
</html>
