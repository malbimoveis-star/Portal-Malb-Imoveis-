<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do corretor — Portal Malb Imóveis</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div id="topbar"></div>

<main>
  <div class="login-shell">
    <h1>Painel do corretor</h1>
    <p class="sub">Entre para gerenciar imóveis e leads.</p>
    <div class="error-msg" id="erro"></div>
    <form class="form-stack" id="form-login">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Entrar</button>
    </form>
    <p class="hint">Acesso de demonstração: <strong>admin@malbimoveis.com</strong> / <strong>malb2026</strong> — troque essa senha antes de usar com dados reais.</p>
  </div>
</main>

<script src="../assets/app.js"></script>
<script>
document.getElementById('topbar').innerHTML = topbarHTML('', '../');

if (getToken()) window.location.href = 'index.html';

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erroEl = document.getElementById('erro');
  erroEl.classList.remove('show');
  try {
    const resp = await api('/auth/login', { method: 'POST', body: {
      email: document.getElementById('email').value,
      senha: document.getElementById('senha').value,
    }});
    setToken(resp.data.token);
    window.location.href = 'index.html';
  } catch (err) {
    erroEl.textContent = err.status === 401 ? 'E-mail ou senha incorretos.' : ('Erro: ' + err.message);
    erroEl.classList.add('show');
  }
});
</script>
</body>
</html>
