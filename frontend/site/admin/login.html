<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do corretor — Portal Malb Imóveis</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div id="topbar"></div>

<main>
  <div class="login-shell">
    <h1>Painel do corretor</h1>
    <p class="sub">Entre para gerenciar imóveis e leads.</p>
    <div class="error-msg" id="erro"></div>
    <form class="form-stack" id="form-login">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha" required autocomplete="current-password">
          <button type="button" class="btn-toggle-senha" data-toggle-senha="senha" tabindex="-1"></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="btn-entrar" style="width:100%;justify-content:center;">Entrar</button>
    </form>
    <p class="hint" id="hint-acordando" style="display:none;">O servidor pode levar até 1 minuto pra responder na primeira vez do dia (fica "dormindo" pra economizar, plano gratuito). Só aguarde — não precisa clicar de novo.</p>
    <p class="hint"><a href="esqueci-senha.html">Esqueci minha senha</a></p>
  </div>
</main>

<script src="../assets/app.js"></script>
<script>
document.getElementById('topbar').innerHTML = topbarHTML('', '../');
ligarTogglesSenha();

if (getToken()) window.location.href = 'index.html';

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erroEl = document.getElementById('erro');
  const btn = document.getElementById('btn-entrar');
  erroEl.classList.remove('show');
  const pararCarregando = iniciarCarregando(btn, 'Entrando…', 'hint-acordando');
  try {
    const resp = await api('/auth/login', { method: 'POST', body: {
      email: document.getElementById('email').value,
      senha: document.getElementById('senha').value,
    }});
    setToken(resp.data.token);
    window.location.href = 'index.html';
  } catch (err) {
    erroEl.textContent = err.status === 401 ? 'E-mail ou senha incorretos.' : ('Erro: ' + err.message);
    erroEl.classList.add('show');
  } finally {
    pararCarregando();
  }
});
</script>
</body>
</html>
