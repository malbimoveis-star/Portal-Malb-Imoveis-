<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar imóveis — Portal Malb Imóveis</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="topbar"></div>

<main>
  <div class="section-head" style="margin-top:2rem;">
    <h1 style="font-size:1.6rem;">Buscar imóveis</h1>
    <span class="count" id="contagem"></span>
  </div>

  <div class="busca-layout">
    <aside class="filtros">
      <h3>Filtros</h3>

      <div class="filtro-grupo">
        <label class="titulo-grupo">Finalidade</label>
        <div class="chip-row" id="chips-finalidade">
          <button class="chip" data-finalidade="">Todas</button>
          <button class="chip" data-finalidade="venda">Comprar</button>
          <button class="chip" data-finalidade="aluguel">Alugar</button>
        </div>
      </div>

      <div class="filtro-grupo">
        <label class="titulo-grupo">Tipo</label>
        <div class="chip-row" id="chips-tipo">
          <button class="chip" data-tipo="">Todos</button>
          <button class="chip" data-tipo="Apartamento">Apartamento</button>
          <button class="chip" data-tipo="Casa">Casa</button>
          <button class="chip" data-tipo="Studio">Studio</button>
          <button class="chip" data-tipo="Cobertura">Cobertura</button>
          <button class="chip" data-tipo="Sala Comercial">Sala Comercial</button>
          <button class="chip" data-tipo="Terreno">Terreno</button>
          <button class="chip" data-tipo="Kitnet">Kitnet</button>
        </div>
      </div>

      <div class="filtro-grupo">
        <label class="titulo-grupo">Quartos (mín.)</label>
        <div class="chip-row" id="chips-quartos">
          <button class="chip" data-quartos="0">Todos</button>
          <button class="chip" data-quartos="1">1+</button>
          <button class="chip" data-quartos="2">2+</button>
          <button class="chip" data-quartos="3">3+</button>
          <button class="chip" data-quartos="4">4+</button>
        </div>
      </div>

      <div class="filtro-grupo">
        <label class="titulo-grupo">Preço máximo</label>
        <input type="range" id="preco" min="1800" max="3400000" step="1000" style="width:100%;">
        <div id="preco-val" style="font-size:.85rem;color:var(--ink-faint);"></div>
      </div>

      <button class="btn btn-ghost" id="btn-limpar">Limpar filtros</button>
    </aside>

    <div id="resultados" class="grid">
      <p style="color:var(--ink-faint)">Carregando…</p>
    </div>
  </div>
</main>

<div id="footer"></div>

<script src="assets/app.js"></script>
<script>
document.getElementById('topbar').innerHTML = topbarHTML('busca');
document.getElementById('footer').innerHTML = footerHTML();

const params = new URLSearchParams(window.location.search);
const estado = {
  finalidade: params.get('finalidade') || '',
  tipo: params.get('tipo') || '',
  q: params.get('q') || '',
  quartosMin: Number(params.get('quartosMin') || 0),
  precoMax: params.get('precoMax') ? Number(params.get('precoMax')) : null,
};

function syncUI() {
  document.querySelectorAll('#chips-finalidade .chip').forEach(b => b.classList.toggle('active', b.dataset.finalidade === estado.finalidade));
  document.querySelectorAll('#chips-tipo .chip').forEach(b => b.classList.toggle('active', b.dataset.tipo === estado.tipo));
  document.querySelectorAll('#chips-quartos .chip').forEach(b => b.classList.toggle('active', Number(b.dataset.quartos) === estado.quartosMin));
  const precoInput = document.getElementById('preco');
  if (estado.precoMax != null) {
    precoInput.value = estado.precoMax;
    document.getElementById('preco-val').textContent = 'até R$ ' + estado.precoMax.toLocaleString('pt-BR');
  } else {
    precoInput.value = precoInput.max;
    document.getElementById('preco-val').textContent = 'sem limite';
  }
}

async function buscar() {
  const qs = new URLSearchParams();
  if (estado.finalidade) qs.set('finalidade', estado.finalidade);
  if (estado.tipo) qs.set('tipo', estado.tipo);
  if (estado.q) qs.set('q', estado.q);
  if (estado.quartosMin) qs.set('quartosMin', estado.quartosMin);
  if (estado.precoMax != null) qs.set('precoMax', estado.precoMax);

  try {
    const resp = await api('/imoveis?' + qs.toString());
    document.getElementById('contagem').textContent = `${resp.total} resultado${resp.total === 1 ? '' : 's'}`;
    document.getElementById('resultados').innerHTML = resp.data.length
      ? resp.data.map(cardHTML).join('')
      : '<div class="empty-state" style="grid-column:1/-1;">Nenhum imóvel encontrado com esses filtros.<br><button class="btn btn-ghost" id="btn-limpar-2" style="margin-top:1rem;">Limpar filtros</button></div>';
    const btn2 = document.getElementById('btn-limpar-2');
    if (btn2) btn2.addEventListener('click', limpar);
  } catch (err) {
    document.getElementById('resultados').innerHTML = `<p style="color:var(--danger)">Não foi possível buscar os imóveis: ${err.message}.</p>`;
  }
}

function limpar() {
  window.location.href = 'busca.html';
}

document.querySelectorAll('#chips-finalidade .chip').forEach(b => b.addEventListener('click', () => { estado.finalidade = b.dataset.finalidade; syncUI(); buscar(); }));
document.querySelectorAll('#chips-tipo .chip').forEach(b => b.addEventListener('click', () => { estado.tipo = b.dataset.tipo; syncUI(); buscar(); }));
document.querySelectorAll('#chips-quartos .chip').forEach(b => b.addEventListener('click', () => { estado.quartosMin = Number(b.dataset.quartos); syncUI(); buscar(); }));
document.getElementById('preco').addEventListener('change', (e) => { estado.precoMax = Number(e.target.value); syncUI(); buscar(); });
document.getElementById('btn-limpar').addEventListener('click', limpar);

syncUI();
buscar();
</script>
</body>
</html>
