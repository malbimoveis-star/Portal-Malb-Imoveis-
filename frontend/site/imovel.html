<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="seo-title">Imóvel — Portal Malb Imóveis</title>
<meta name="description" id="meta-desc" content="Detalhes do imóvel — Portal Malb Imóveis.">
<meta name="robots" content="index, follow">
<link rel="canonical" id="seo-canonical" href="">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Malb Imóveis">
<meta property="og:title" id="og-title" content="Portal Malb Imóveis">
<meta property="og:description" id="og-desc" content="">
<meta property="og:url" id="og-url" content="">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" id="twitter-title" content="Portal Malb Imóveis">
<meta name="twitter:description" id="twitter-desc" content="">
<script type="application/ld+json" id="ld-json">null</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="topbar"></div>

<main id="conteudo">
  <p style="color:var(--ink-faint);margin-top:2rem;">Carregando imóvel…</p>
</main>

<div id="footer"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/app.js"></script>
<script>
document.getElementById('topbar').innerHTML = topbarHTML('');
document.getElementById('footer').innerHTML = footerHTML();

const id = new URLSearchParams(window.location.search).get('id');

async function carregar() {
  if (!id) {
    document.getElementById('conteudo').innerHTML = '<p style="margin-top:2rem;">Imóvel não especificado. <a href="busca.html">Voltar para a busca</a>.</p>';
    return;
  }
  try {
    const { data: im } = await api('/imoveis/' + id);
    aplicarSeoImovel(im);
    const per = im.finalidade === 'aluguel' ? '<span style="font-size:.8rem;font-weight:500;color:var(--ink-faint);">/mês</span>' : '';
    const iniciais = (im.bairro || '?').slice(0, 2).toUpperCase();

    document.getElementById('conteudo').innerHTML = `
      <a href="busca.html" class="btn btn-ghost" style="margin:1.4rem 0;">&larr; Voltar</a>
      <div class="detail-hero">
        ${im.foto ? `<img src="${im.foto}" alt="${(im.tipo + ' ' + (im.finalidade === 'aluguel' ? 'para alugar' : 'à venda') + ' em ' + im.bairro + ', ' + im.cidade + ' — ' + im.titulo).replace(/"/g, '&quot;')}">` : ''}
        <button type="button" class="fav-btn large" id="fav-detalhe" style="position:absolute;margin:.7rem;" aria-label="Favoritar"></button>
      </div>

      <div class="detail-layout">
        <div>
          <div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;">
            <h1 style="font-size:1.7rem;">${im.titulo}</h1>
            <span class="badge ${im.finalidade}" style="position:static;display:inline-block;">${im.finalidade === 'venda' ? 'Venda' : 'Aluguel'}</span>
          </div>
          <p style="color:var(--ink-faint);margin:.4rem 0 1rem;">${im.bairro}, ${im.cidade}</p>
          <div class="price" style="font-size:1.8rem;font-weight:700;">${fmtPreco(im.preco, im.finalidade)}${per}</div>

          <div class="feature-grid">
            <div class="feature-tile"><div class="num">${im.quartos}</div><div class="label">Quartos</div></div>
            <div class="feature-tile"><div class="num">${im.banheiros}</div><div class="label">Banheiros</div></div>
            <div class="feature-tile"><div class="num">${im.vagas}</div><div class="label">Vagas</div></div>
            <div class="feature-tile"><div class="num">${im.area}m²</div><div class="label">Área</div></div>
          </div>

          <p>${im.descricao || ''}</p>

          ${im.amenities && im.amenities.length ? `
            <h3 style="font-size:1.1rem;margin-top:1.6rem;">Comodidades</h3>
            <div class="amenity-list">${im.amenities.map(a => `<span class="amenity">${a}</span>`).join('')}</div>
          ` : ''}

          <h3 style="font-size:1.1rem;margin-top:1.6rem;">Localização</h3>
          <div class="detail-map" id="mapa">
            ${im.lat != null && im.lng != null ? '' : '<div class="sem-mapa">Localização exata não cadastrada para este imóvel.</div>'}
          </div>
        </div>

        <div class="contact-card">
          <div class="agent">
            <div class="av">${iniciais}</div>
            <div>
              <div style="font-weight:600;">Corretor Malb Imóveis</div>
              <div class="creci">CRECI 000000-F (exemplo)</div>
            </div>
          </div>
          <form class="form-stack" id="form-lead">
            <input type="text" name="nome" placeholder="Seu nome" required>
            <input type="text" name="contato" placeholder="Telefone ou e-mail" required>
            <textarea name="mensagem" rows="3" placeholder="Mensagem">Olá! Tenho interesse no imóvel "${im.titulo}" em ${im.bairro}.</textarea>
            <button type="submit" class="btn btn-primary">Enviar interesse</button>
          </form>
        </div>
      </div>
    `;

    const favBtn = document.getElementById('fav-detalhe');
    const atualizarFav = () => {
      const ativo = isFavorito(im.id);
      favBtn.classList.toggle('active', ativo);
      favBtn.innerHTML = `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7.2-4.6-10-9.1C.3 8.6 1.6 5 5.1 4.1c2-.5 4 .3 5.2 2 .3.4.8.4 1.1 0 1.2-1.7 3.2-2.5 5.2-2 3.5.9 4.8 4.5 3.1 7.8C19.2 16.4 12 21 12 21z"/></svg>`;
      favBtn.setAttribute('aria-label', ativo ? 'Remover dos favoritos' : 'Adicionar aos favoritos');
    };
    atualizarFav();
    favBtn.addEventListener('click', () => { toggleFavorito(im.id); atualizarFav(); });

    if (im.lat != null && im.lng != null) {
      if (window.L) {
        try {
          const mapa = L.map('mapa', { scrollWheelZoom: false }).setView([im.lat, im.lng], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19,
          }).addTo(mapa);
          L.marker([im.lat, im.lng]).addTo(mapa).bindPopup(im.titulo);
        } catch (e) {
          document.getElementById('mapa').innerHTML = '<div class="sem-mapa">Não foi possível carregar o mapa.</div>';
        }
      } else {
        // biblioteca do mapa (carregada de um CDN) não chegou a tempo ou a conexão bloqueou o CDN
        document.getElementById('mapa').innerHTML = '<div class="sem-mapa">Mapa indisponível no momento (verifique sua conexão).</div>';
      }
    }

    document.getElementById('form-lead').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button');
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        await api('/leads', { method: 'POST', body: {
          imovelId: im.id,
          nome: form.nome.value,
          contato: form.contato.value,
          mensagem: form.mensagem.value,
        }});
        showToast('Interesse enviado! O corretor vai entrar em contato.');
        form.reset();
      } catch (err) {
        showToast('Não foi possível enviar: ' + err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Enviar interesse';
      }
    });
  } catch (err) {
    document.getElementById('conteudo').innerHTML = `<p style="margin-top:2rem;color:var(--danger);">Imóvel não encontrado ou servidor indisponível (${err.message}). <a href="busca.html">Voltar para a busca</a>.</p>`;
  }
}
carregar();
</script>
</body>
</html>
